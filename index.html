<!DOCTYPE html>
<html lang="pt" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ferramenta educacional sobre sintomas e tratamentos da Neurofibromatose tipo 1 (NF1). Não substitui aconselhamento médico.">
  <meta name="theme-color" content="#f8f7f4">
  <title>NF1 Tracker — Neurofibromatose Tipo 1</title>

  <!-- Preload critical font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

  <style>
    /* ── RESET & TOKENS ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #f8f7f4;
      --surface:    #ffffff;
      --border:     #e8e4dc;
      --border2:    #d4cfc5;
      --text:       #1a1814;
      --muted:      #6b6760;
      --faint:      #a09d98;
      --accent:     #2d5fa6;
      --accent-bg:  #eef2fb;
      --accent-dk:  #1e4278;
      --emerald:    #0e6a4e;
      --emerald-bg: #eaf5f0;
      --amber:      #92520a;
      --amber-bg:   #fdf3e3;
      --red:        #9b2c2c;
      --red-bg:     #fdf0f0;
      --indigo:     #3730a3;
      --indigo-bg:  #eef2ff;
      --radius-sm:  6px;
      --radius:     12px;
      --radius-lg:  18px;
      --shadow:     0 1px 3px rgba(0,0,0,.07), 0 4px 12px rgba(0,0,0,.04);
      --font-body:  'DM Sans', system-ui, sans-serif;
      --font-serif: 'DM Serif Display', Georgia, serif;
      --transition: 160ms ease;
    }

    /* ── DARK MODE ────────────────────────────────────────── */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #141210;
        --surface:    #1e1c19;
        --border:     #2e2b26;
        --border2:    #3d3a34;
        --text:       #f0ede8;
        --muted:      #9a9590;
        --faint:      #6b6760;
        --accent:     #6b9ee8;
        --accent-bg:  #1a2540;
        --accent-dk:  #93bbf5;
        --emerald:    #4db896;
        --emerald-bg: #0d2a22;
        --amber:      #e8a94a;
        --amber-bg:   #2a1e08;
        --red:        #f08080;
        --red-bg:     #2a0f0f;
        --indigo:     #a5b4fc;
        --indigo-bg:  #1a1a3a;
        --shadow:     0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
      }
    }

    /* ── BASE ─────────────────────────────────────────────── */
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.65;
      min-height: 100dvh;
    }

    /* ── SKIP LINK (WCAG) ────────────────────────────────── */
    .skip-link {
      position: absolute; top: -9999px; left: 1rem;
      background: var(--accent); color: #fff;
      padding: .5rem 1rem; border-radius: var(--radius-sm);
      font-size: .9rem; font-weight: 500; z-index: 9999;
      text-decoration: none;
    }
    .skip-link:focus { top: 1rem; }

    /* ── DISCLAIMER BANNER ───────────────────────────────── */
    .disclaimer {
      background: var(--amber-bg);
      border-bottom: 1px solid var(--border);
      padding: .6rem 1.25rem;
      display: flex; align-items: center; gap: .6rem;
      font-size: .8rem; color: var(--amber);
      line-height: 1.4;
    }
    .disclaimer svg { flex-shrink: 0; width: 16px; height: 16px; }

    /* ── HEADER ───────────────────────────────────────────── */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      position: sticky; top: 0; z-index: 100;
    }
    .site-header h1 {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 400;
      color: var(--text);
      flex: 1;
    }
    .site-header h1 em {
      font-style: italic;
      color: var(--accent);
    }

    /* ── LANG SWITCHER ───────────────────────────────────── */
    .lang-switcher {
      display: flex; gap: 2px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 2px;
    }
    .lang-btn {
      padding: .25rem .55rem;
      font-size: .75rem; font-weight: 500;
      border: none; background: transparent;
      color: var(--muted); border-radius: 4px;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
    }
    .lang-btn.active,
    .lang-btn:hover { background: var(--surface); color: var(--text); }
    .lang-btn.active { box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    /* ── READING MODE TOGGLE ─────────────────────────────── */
    .mode-toggle {
      display: flex; align-items: center; gap: .5rem;
      font-size: .8rem; color: var(--muted);
    }
    .mode-switch {
      position: relative; display: inline-block;
      width: 42px; height: 24px;
    }
    .mode-switch input { opacity: 0; width: 0; height: 0; }
    .mode-slider {
      position: absolute; inset: 0;
      background: var(--border2); border-radius: 12px;
      cursor: pointer; transition: var(--transition);
    }
    .mode-slider::before {
      content: '';
      position: absolute; width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: var(--surface); border-radius: 50%;
      transition: var(--transition);
    }
    .mode-switch input:checked + .mode-slider { background: var(--accent); }
    .mode-switch input:checked + .mode-slider::before { transform: translateX(18px); }
    .mode-switch input:focus-visible + .mode-slider { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── LAYOUT ───────────────────────────────────────────── */
    .layout {
      max-width: 1280px; margin: 0 auto;
      padding: 1.5rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 1024px) {
      .layout { grid-template-columns: 420px 1fr; align-items: start; }
    }

    /* ── SIDEBAR ──────────────────────────────────────────── */
    .sidebar { display: flex; flex-direction: column; gap: 1rem; }
    .selected-count {
      font-size: .85rem; color: var(--muted);
      padding: .1rem 0;
    }
    .selected-count strong { color: var(--text); }

    /* ── CATEGORY SECTION ─────────────────────────────────── */
    .cat-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .cat-header {
      padding: .85rem 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: .6rem;
    }
    .cat-icon {
      width: 28px; height: 28px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cat-icon svg { width: 15px; height: 15px; }
    .cat-header h2 { font-size: .95rem; font-weight: 500; }

    /* ── SYMPTOM ROW ──────────────────────────────────────── */
    .symptom-row {
      padding: .9rem 1.1rem;
      display: flex; gap: .85rem; align-items: flex-start;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }
    .symptom-row:last-child { border-bottom: none; }
    .symptom-row.active { background: var(--accent-bg); }
    .symptom-info { flex: 1; min-width: 0; }
    .symptom-name-row {
      display: flex; align-items: center; gap: .45rem;
      flex-wrap: wrap; margin-bottom: .2rem;
    }
    .symptom-name { font-size: .9rem; font-weight: 500; }
    .prevalence-badge {
      font-size: .7rem; font-weight: 500;
      background: var(--bg); color: var(--muted);
      border: 1px solid var(--border);
      padding: .1rem .45rem; border-radius: 99px;
    }
    .symptom-desc {
      font-size: .8rem; color: var(--muted); line-height: 1.5;
    }

    /* ── TOGGLE ───────────────────────────────────────────── */
    .toggle-wrap { flex-shrink: 0; padding-top: 2px; }
    .toggle-wrap input[type="checkbox"] { display: none; }
    .toggle-track {
      display: flex; align-items: center;
      width: 44px; height: 26px;
      background: var(--border2);
      border-radius: 13px;
      cursor: pointer;
      transition: background var(--transition);
      position: relative;
    }
    .toggle-track::after {
      content: '';
      position: absolute; left: 3px;
      width: 20px; height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: transform var(--transition);
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .toggle-wrap input:checked + .toggle-track { background: var(--accent); }
    .toggle-wrap input:checked + .toggle-track::after { transform: translateX(18px); }
    .toggle-wrap input:focus-visible + .toggle-track {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── GENERATE BUTTON ──────────────────────────────────── */
    .btn-generate {
      width: 100%;
      padding: .85rem 1.25rem;
      background: var(--accent);
      color: #fff;
      border: none; border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: .95rem; font-weight: 500;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
      box-shadow: 0 2px 8px rgba(45,95,166,.3);
    }
    .btn-generate:hover { background: var(--accent-dk); }
    .btn-generate:active { transform: scale(.98); }
    .btn-generate:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .btn-generate:disabled {
      background: var(--border2); color: var(--faint);
      box-shadow: none; cursor: not-allowed;
    }

    /* ── MAIN PANEL ───────────────────────────────────────── */
    .main-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-toolbar {
      padding: .85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: .6rem;
      flex-wrap: wrap;
    }

    /* ── TABS ─────────────────────────────────────────────── */
    .tab-group {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .tab-btn {
      padding: .4rem .8rem;
      font-size: .82rem; font-weight: 500;
      background: transparent; border: none;
      color: var(--muted); cursor: pointer;
      font-family: var(--font-body);
      transition: var(--transition);
    }
    .tab-btn[aria-selected="true"] {
      background: var(--text); color: var(--surface);
    }
    .tab-btn:hover:not([aria-selected="true"]) { background: var(--bg); }
    .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* ── TOOLBAR BUTTONS ──────────────────────────────────── */
    .btn-small {
      padding: .4rem .75rem;
      font-size: .8rem; font-weight: 400;
      border: 1px solid var(--border);
      background: transparent; color: var(--text);
      border-radius: var(--radius-sm);
      cursor: pointer; font-family: var(--font-body);
      transition: var(--transition);
    }
    .btn-small:hover { background: var(--bg); }
    .btn-small:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── PANEL CONTENT ────────────────────────────────────── */
    .panel-body { padding: 1.25rem; }

    /* ── EMPTY STATE ──────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 3rem 1.5rem;
      color: var(--muted);
    }
    .empty-state svg { width: 48px; height: 48px; margin: 0 auto 1rem; opacity: .4; }
    .empty-state p { font-size: .9rem; line-height: 1.6; }

    /* ── SLIDER ───────────────────────────────────────────── */
    .slider-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .slide-pos { font-size: .82rem; color: var(--muted); }

    /* ── SLIDE CARD ───────────────────────────────────────── */
    .slide-card {
      background: var(--indigo-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }
    .slide-category {
      display: inline-block;
      font-size: .75rem; font-weight: 500;
      color: var(--indigo);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: .2rem .6rem;
      margin-bottom: .6rem;
    }
    .slide-title {
      font-family: var(--font-serif);
      font-size: 1.6rem; font-weight: 400;
      color: var(--text); line-height: 1.2;
      margin-bottom: .3rem;
    }
    .slide-prevalence {
      font-size: .82rem; color: var(--muted);
      margin-bottom: 1rem;
    }
    .slide-prevalence strong { color: var(--accent); }

    /* ── SLIDE GRID ───────────────────────────────────────── */
    .slide-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: .75rem;
      margin-bottom: .75rem;
    }
    @media (min-width: 640px) {
      .slide-grid { grid-template-columns: 1fr 1fr; }
    }
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .85rem;
    }
    .info-card h4 {
      font-size: .78rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: .04em;
      color: var(--faint); margin-bottom: .5rem;
    }
    .info-card p, .info-card li {
      font-size: .85rem; color: var(--text); line-height: 1.55;
    }
    .info-card ul { padding-left: 1.1rem; }
    .info-card li { margin-bottom: .25rem; }

    /* ── MANAGEMENT PILLS ─────────────────────────────────── */
    .mgmt-list {
      display: flex; flex-wrap: wrap; gap: .4rem;
      list-style: none; padding: 0;
    }
    .mgmt-list li {
      font-size: .78rem;
      background: var(--emerald-bg);
      color: var(--emerald);
      border: 1px solid color-mix(in srgb, var(--emerald) 20%, transparent);
      border-radius: var(--radius-sm);
      padding: .3rem .65rem;
    }

    /* ── PREVALENCE BAR ───────────────────────────────────── */
    .prev-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .85rem;
      margin-bottom: .75rem;
    }
    .prev-section h4 {
      font-size: .78rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: .04em;
      color: var(--faint); margin-bottom: .6rem;
    }
    .prev-bar-wrap {
      display: flex; align-items: center; gap: .75rem;
    }
    .prev-bar-track {
      flex: 1; height: 10px;
      background: var(--accent-bg);
      border-radius: 5px; overflow: hidden;
    }
    .prev-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 5px;
      transition: width .4s ease;
    }
    .prev-pct {
      font-size: .85rem; font-weight: 500;
      color: var(--accent); min-width: 2.5rem; text-align: right;
    }

    /* ── TIMELINE ─────────────────────────────────────────── */
    .timeline-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .85rem;
      margin-bottom: .75rem;
    }
    .timeline-section h4 {
      font-size: .78rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: .04em;
      color: var(--faint); margin-bottom: .75rem;
    }
    .timeline-track {
      position: relative;
      display: flex; gap: 0;
    }
    .timeline-phase {
      flex: 1; text-align: center; padding: 0 .25rem;
      position: relative;
    }
    .timeline-phase::before {
      content: '';
      display: block; height: 6px;
      background: var(--border); border-radius: 3px;
      margin-bottom: .4rem;
    }
    .timeline-phase.active::before { background: var(--accent); }
    .timeline-phase.onset::before { background: var(--amber); }
    .timeline-label {
      font-size: .7rem; color: var(--faint); display: block;
    }
    .timeline-phase.active .timeline-label { color: var(--accent); font-weight: 500; }
    .timeline-phase.onset .timeline-label { color: var(--amber); font-weight: 500; }

    /* ── SOURCES SECTION ──────────────────────────────────── */
    .sources-section {
      background: var(--accent-bg);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius: var(--radius-sm);
      padding: .85rem;
    }
    .sources-section h4 {
      font-size: .78rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: .04em;
      color: var(--accent); margin-bottom: .6rem;
    }
    .sources-grid {
      display: grid; grid-template-columns: 1fr;
      gap: .4rem;
    }
    @media (min-width: 480px) {
      .sources-grid { grid-template-columns: 1fr 1fr; }
    }
    .source-link {
      display: flex; align-items: center; justify-content: space-between;
      gap: .5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .5rem .75rem;
      text-decoration: none;
      color: var(--accent);
      font-size: .78rem; font-weight: 500;
      transition: var(--transition);
    }
    .source-link:hover { background: var(--bg); }
    .source-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .source-link svg { width: 12px; height: 12px; flex-shrink: 0; }
    .source-link span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sources-note {
      font-size: .72rem; color: var(--muted);
      margin-top: .5rem;
    }

    /* ── NEXT STEPS ───────────────────────────────────────── */
    .next-steps-section {
      margin-top: .75rem;
      background: var(--emerald-bg);
      border: 1px solid color-mix(in srgb, var(--emerald) 20%, transparent);
      border-radius: var(--radius-sm);
      padding: .85rem;
    }
    .next-steps-section h4 {
      font-size: .78rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: .04em;
      color: var(--emerald); margin-bottom: .6rem;
    }
    .next-steps-list {
      list-style: none; padding: 0;
      display: flex; flex-direction: column; gap: .35rem;
    }
    .next-steps-list li {
      display: flex; align-items: flex-start; gap: .5rem;
      font-size: .82rem; color: var(--text); line-height: 1.4;
    }
    .next-steps-list li::before {
      content: '';
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--emerald);
      flex-shrink: 0; margin-top: .45rem;
    }

    /* ── OVERVIEW GRID ────────────────────────────────────── */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: .75rem;
    }
    .overview-card {
      background: var(--indigo-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .9rem;
    }
    .overview-cat {
      font-size: .7rem; font-weight: 500; color: var(--indigo);
      text-transform: uppercase; letter-spacing: .04em;
      margin-bottom: .3rem;
    }
    .overview-name {
      font-size: .9rem; font-weight: 500;
      color: var(--text); margin-bottom: .2rem;
    }
    .overview-prev {
      font-size: .75rem; color: var(--muted); margin-bottom: .4rem;
    }
    .overview-desc {
      font-size: .78rem; color: var(--muted); line-height: 1.5;
    }

    /* ── GLOSSARY TOOLTIP ─────────────────────────────────── */
    .glossary-term {
      border-bottom: 1px dashed var(--accent);
      cursor: help; position: relative;
      color: var(--accent-dk);
    }
    [data-tooltip] { position: relative; }
    [data-tooltip]:hover::after,
    [data-tooltip]:focus::after {
      content: attr(data-tooltip);
      position: absolute; bottom: calc(100% + 6px); left: 50%;
      transform: translateX(-50%);
      background: var(--text); color: var(--surface);
      font-size: .75rem; line-height: 1.4;
      padding: .4rem .65rem; border-radius: var(--radius-sm);
      white-space: nowrap; max-width: 220px;
      white-space: normal; z-index: 200;
      pointer-events: none;
    }

    /* ── FOOTER ───────────────────────────────────────────── */
    .site-footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 1.25rem 1.5rem;
      display: flex; flex-direction: column; gap: .5rem;
      align-items: center; text-align: center;
    }
    .footer-disclaimer {
      font-size: .78rem; color: var(--muted); line-height: 1.6;
      max-width: 640px;
    }
    .footer-links {
      display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
    }
    .footer-links a {
      font-size: .78rem; color: var(--accent);
      text-decoration: none;
    }
    .footer-links a:hover { text-decoration: underline; }
    .footer-links a:focus-visible { outline: 2px solid var(--accent); border-radius: 2px; }

    /* ── PRINT ────────────────────────────────────────────── */
    @media print {
      .site-header, .sidebar, .panel-toolbar, .slider-nav, .disclaimer,
      .btn-generate, .lang-switcher, .mode-toggle, .btn-small { display: none !important; }
      .layout { grid-template-columns: 1fr !important; }
      .main-panel { box-shadow: none; border: 1px solid #ccc; }
      .slide-card { background: #f8f8ff; }
      body { font-size: 12pt; }
      a[href]::after { content: " (" attr(href) ")"; font-size: .75em; color: #555; }
    }

    /* ── HIDDEN UTILITY ───────────────────────────────────── */
    .hidden { display: none !important; }
    .sr-only {

          ]
        },
      ]
    },
    {
      id: 'other',

          },

          },

            pt: ['Problemas nos vasos sanguíneos relacionados com o NF1'],

          },

            pt: ['Pode causar dores de cabeça ou cansaço','Precisa de tratamento'],
            en: ['Can cause headaches or tiredness','Needs treatment'],

          },
          nextSteps: {
            pt: ['Medir a pressão arterial regularmente','Pedir análises renais e avaliação vascular se indicado'],
            en: ['Monitor blood pressure regularly','Request kidney tests and vascular assessment if indicated'],
            es: ['Medir la presión arterial regularmente','Solicitar análisis renales y evaluación vascular si está indicado']
          },
          timeline: { onset: 'adult', active: ['teen','adult'] },
          sources: [
            { label: 'NORD — NF1', url: 'https://www.nord.org/diseases/neurofibromatosis-type-1/' },
            { label: 'Orphanet — NF1', url: 'https://www.orpha.net/en/disease/detail/636' }
          ]
        },
      ]
    }
  ];

  /* ════════════════════════════════════════
     STATE
  ════════════════════════════════════════ */
  let lang = 'pt';
  let simpleMode = false;
  let mode = 'individual';
  let selected = new Set();
  let cards = [];
  let activeIndex = 0;

  /* ════════════════════════════════════════
     i18n
  ════════════════════════════════════════ */
  function t(key) {
    const v = LANGS[lang][key];
    return v !== undefined ? v : key;
  }

  function applyTranslations() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      const val = LANGS[lang][key];
      if (typeof val === 'string') el.textContent = val;
    });
    updateSelectedCount();
    if (cards.length) renderResults();
  }

  function setLang(l) {
    lang = l;
    document.querySelectorAll('.lang-btn').forEach(btn => {
      const isActive = btn.getAttribute('onclick').includes(`'${l}'`);
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', String(isActive));
    });
    applyTranslations();
    renderSymptoms();
  }

  /* ════════════════════════════════════════
     SIMPLE MODE
  ════════════════════════════════════════ */
  function toggleSimple(on) {
    simpleMode = on;
    document.body.classList.toggle('simple', on);
    if (cards.length) renderResults();
  }

  /* ════════════════════════════════════════
     RENDER SYMPTOM LIST
  ════════════════════════════════════════ */
  function renderSymptoms() {
    const elList = document.getElementById('symptomList');
    elList.innerHTML = '';

    CATEGORIES.forEach(cat => {
      const section = document.createElement('section');
      section.setAttribute('role', 'listitem');
      section.className = 'cat-section';

      const bgColor = cat.color;
      const icColor = cat.iconColor;
      section.innerHTML = `
        <div class="cat-header" style="background:${bgColor}">
          <div class="cat-icon" style="background:${icColor}20;">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" style="color:${icColor}">
              ${cat.icon}
            </svg>
          </div>
          <h2 style="color:${icColor}">${cat.titles[lang]}</h2>
        </div>`;

      cat.items.forEach(item => {
        const isOn = selected.has(item.id);
        const row = document.createElement('div');
        row.className = `symptom-row${isOn ? ' active' : ''}`;
        row.setAttribute('role', 'listitem');

        const name = simpleMode ? item.namesSimple[lang] : item.names[lang];
        const desc = simpleMode ? item.descSimple[lang] : item.desc[lang];
        const cbId = `cb-${item.id}`;

        row.innerHTML = `
          <div class="symptom-info">
            <div class="symptom-name-row">
              <span class="symptom-name">${name}</span>
              <span class="prevalence-badge">${item.prevalence}</span>
            </div>
            <p class="symptom-desc">${desc}</p>
          </div>
          <div class="toggle-wrap">
            <input type="checkbox" id="${cbId}"
              aria-label="${name}"
              ${isOn ? 'checked' : ''} />
            <label class="toggle-track" for="${cbId}" aria-hidden="true"></label>
          </div>`;

        row.querySelector('input').addEventListener('change', e => {
          const on = e.target.checked;
          if (on) selected.add(item.id); else selected.delete(item.id);
          row.classList.toggle('active', on);
          updateSelectedCount();
          document.getElementById('generateBtn').disabled = selected.size === 0;
        });

        section.appendChild(row);
      });

      elList.appendChild(section);
    });
  }

  /* ════════════════════════════════════════
     SELECTED COUNT
  ════════════════════════════════════════ */
  function updateSelectedCount() {
    const n = selected.size;
    const el = document.getElementById('selectedCount');
    if (n === 0) el.innerHTML = t('selected_none');
    else if (n === 1) el.innerHTML = `<strong>${t('selected_one')}</strong>`;
    else el.innerHTML = `<strong>${t('selected_many')(n)}</strong>`;
  }

  /* ════════════════════════════════════════
     COMPUTE CARDS
  ════════════════════════════════════════ */
  function computeCards() {
    const list = [];
    CATEGORIES.forEach(cat => {
      cat.items.forEach(it => {
        if (selected.has(it.id)) list.push({ ...it, categoryTitle: cat.titles });
      });
    });
    return list;
  }

  /* ════════════════════════════════════════
     GENERATE
  ════════════════════════════════════════ */
  function generate() {
    if (!selected.size) return;
    cards = computeCards();
    activeIndex = 0;
    setMode('individual');
    document.getElementById('main-content').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ════════════════════════════════════════
     SET MODE
  ════════════════════════════════════════ */
  function setMode(newMode) {
    mode = newMode;
    const ti = document.getElementById('tabIndividual');
    const to = document.getElementById('tabOverview');
    ti.setAttribute('aria-selected', String(mode === 'individual'));
    to.setAttribute('aria-selected', String(mode === 'overview'));
    renderResults();
  }

  /* ════════════════════════════════════════
     RENDER RESULTS
  ════════════════════════════════════════ */
  function renderResults() {
    const elEmpty   = document.getElementById('emptyState');
    const elSlider  = document.getElementById('slider');
    const elOverview = document.getElementById('overviewGrid');

    if (!cards.length) {
      elEmpty.classList.remove('hidden');
      elSlider.classList.add('hidden');
      elOverview.classList.add('hidden');
      return;
    }
    elEmpty.classList.add('hidden');
    if (mode === 'individual') {
      elSlider.classList.remove('hidden');
      elOverview.classList.add('hidden');
      renderSlide();
    } else {
      elSlider.classList.add('hidden');
      elOverview.classList.remove('hidden');
      renderOverview();
    }
  }

  /* ════════════════════════════════════════
     RENDER SLIDE
  ════════════════════════════════════════ */
  function getName(s)    { return simpleMode ? s.namesSimple[lang]  : s.names[lang]; }
  function getWhat(s)    { return simpleMode ? s.whatSimple[lang]   : s.whatIsIt[lang]; }
  function getCauses(s)  { return simpleMode ? s.causesSimple[lang] : s.causes[lang]; }
  function getAffects(s) { return simpleMode ? s.affectsSimple[lang]: s.affects[lang]; }

  function renderSlide() {
    const s = cards[activeIndex];
    const src = s.sources || [];
    const elPos = document.getElementById('slidePos');
    elPos.textContent = `${activeIndex + 1} ${t('of')} ${cards.length}`;

    const phases = ['birth','child','teen','adult'];
    const timelineHTML = phases.map(ph => {
      const phLabel = t('phase')[ph];
      const isOnset  = s.timeline?.onset === ph ? 'onset'  : '';
      const isActive = s.timeline?.active?.includes(ph) && !isOnset ? 'active' : '';
      return `<div class="timeline-phase ${isOnset || isActive}" aria-label="${phLabel}${isOnset?' (início)':''}">
        <span class="timeline-label">${phLabel}</span>
      </div>`;
    }).join('');

    const sourcesHTML = src.map(x => `
      <a class="source-link" href="${x.url}" target="_blank" rel="noopener noreferrer">
        <span>${x.label}</span>
        <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M7 1h4v4M5 7l6-6M2 3h3M2 3v7h7V7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>`).join('');

    const nextStepsHTML = (s.nextSteps?.[lang] || []).map(ns =>
      `<li>${ns}</li>`
    ).join('');

    const mgmtHTML = s.management[lang].map(m => `<li>${m}</li>`).join('');
    const causesHTML = getCauses(s).map(c => `<li>${c}</li>`).join('');
    const affectsHTML = getAffects(s).map(a => `<li>${a}</li>`).join('');

    document.getElementById('slideCard').innerHTML = `
      <div class="slide-category">${s.categoryTitle[lang]}</div>
      <h3 class="slide-title">${getName(s)}</h3>
      <p class="slide-prevalence">${t('prevalence')}: <strong>${s.prevalence}</strong></p>

      <div class="slide-grid">
        <div class="info-card">
          <h4>${t('what_is_it')}</h4>
          <p class="clinical">${s.whatIsIt[lang]}</p>
          <p class="simple-text">${s.whatSimple[lang]}</p>
        </div>
        <div class="info-card">
          <h4>${t('causes')}</h4>
          <ul class="clinical">${s.causes[lang].map(c=>`<li>${c}</li>`).join('')}</ul>
          <ul class="simple-text">${s.causesSimple[lang].map(c=>`<li>${c}</li>`).join('')}</ul>
        </div>
        <div class="info-card">
          <h4>${t('affects')}</h4>
          <ul class="clinical">${s.affects[lang].map(a=>`<li>${a}</li>`).join('')}</ul>
          <ul class="simple-text">${s.affectsSimple[lang].map(a=>`<li>${a}</li>`).join('')}</ul>
        </div>
        <div class="info-card">
          <h4>${t('management')}</h4>
          <ul class="mgmt-list">${mgmtHTML}</ul>
        </div>
      </div>

      <div class="prev-section">
        <h4>${t('how_common')}</h4>
        <div class="prev-bar-wrap">
          <div class="prev-bar-track" role="progressbar" aria-valuenow="${s.rateNum}" aria-valuemin="0" aria-valuemax="100" aria-label="${s.rateNum}%">
            <div class="prev-bar-fill" style="width:${Math.max(0,Math.min(100,s.rateNum))}%"></div>
          </div>
          <span class="prev-pct">${s.rateNum}%</span>
        </div>
      </div>

      <div class="timeline-section">
        <h4>${t('timeline')}</h4>
        <div class="timeline-track" role="img" aria-label="Linha do tempo de aparecimento">${timelineHTML}</div>
      </div>

      ${nextStepsHTML ? `
      <div class="next-steps-section">
        <h4>${t('next_steps')}</h4>
        <ul class="next-steps-list">${nextStepsHTML}</ul>
      </div>` : ''}

      ${sourcesHTML ? `
      <div class="sources-section">
        <h4>${t('sources')}</h4>
        <div class="sources-grid">${sourcesHTML}</div>
        <p class="sources-note">${t('opens_new_tab')}</p>
      </div>` : ''}
    `;
  }

  /* ════════════════════════════════════════
     RENDER OVERVIEW
  ════════════════════════════════════════ */
  function renderOverview() {
    const el = document.getElementById('overviewGrid');
    el.innerHTML = cards.map(s => `
      <div class="overview-card">
        <div class="overview-cat">${s.categoryTitle[lang]}</div>
        <div class="overview-name">${getName(s)}</div>
        <div class="overview-prev">${t('overview_prev')} ${s.prevalence}</div>
        <div class="overview-desc">${simpleMode ? s.descSimple[lang] : s.desc[lang]}</div>
      </div>`).join('');
  }

  /* ════════════════════════════════════════
     NAVIGATION
  ════════════════════════════════════════ */
  function prevSlide() {
    activeIndex = (activeIndex - 1 + cards.length) % cards.length;
    renderSlide();
  }
  function nextSlide() {
    activeIndex = (activeIndex + 1) % cards.length;
    renderSlide();
  }

  /* Keyboard navigation on slider */
  document.addEventListener('keydown', e => {
    if (!document.getElementById('slider').classList.contains('hidden')) {
      if (e.key === 'ArrowLeft')  { e.preventDefault(); prevSlide(); }
      if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
    }
  });

  /* ════════════════════════════════════════
     INIT
  ════════════════════════════════════════ */
  renderSymptoms();
  applyTranslations();
  updateSelectedCount();
  renderResults();
  </script>
</body>
</html>
